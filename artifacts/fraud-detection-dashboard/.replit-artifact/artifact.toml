kind = "web"
previewPath = "/"
title = "Fraud Detection Dashboard"
version = "1.0.0"
id = "artifacts/fraud-detection-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20826

[services.development]
run = "pnpm --filter @workspace/fraud-detection-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fraud-detection-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/fraud-detection-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20826"
BASE_PATH = "/"
